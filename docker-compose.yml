services:
  postgres:
    image: postgres:17
    container_name: po_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: purchase_order_db
    ports:
      - "5432:5432"

  redis:
    image: redis:8
    container_name: po_redis
    restart: unless-stopped
    ports:
      - "6379:6379"